 "methodology": [
  {
   "title": "Market Potential Score",
   "body": [
    "Where are a healthcare advertiser's customers, and which geographies deserve the most ad dollars?",
    "Score = 40% Consumer Demand + 25% Category Spending + 15% Spending Power + 20% Competition. Each part is a percentile (0–100) against markets at the same level. No score is shown when a part has no data.",
    "Exceptions: Pharmacy leaves out Spending Power (prescriptions follow age and health, mostly paid by insurance). Urgent care, Hearing and Med spa leave out Competition (no matching Census business count). Remaining parts keep their relative weights."
   ]
  },
  {
   "title": "Consumer Demand",
   "body": [
    "Each category's likely customers, count and concentration.",
    "Urgent care: population, households with children, insured adults 18–64. Pharmacy: residents 65+ (count and share), diabetes, high blood pressure. Dental: adults, no dental visit in the past year (household income counts once, under Spending Power). Hearing: age 65+, hearing disability. Eye care: residents 45+ (count and share), diabetes. Chiropractic and PT: adults 25–64, arthritis, obesity. Behavioral health: adults, depression, frequent mental distress. Med spa: residents 30–64 (count and share), households earning $150K+. Senior and home care: age 65+, 75+, independent-living disability.",
    "Health measures are CDC PLACES adult estimates."
   ]
  },
  {
   "title": "Pennsylvania and Kentucky health measures",
   "body": [
    "CDC's newest release omits most measures for these two states. Missing values are filled by whichever of four methods tested most accurate when predicting a whole neighboring state: prior-release values adjusted by neighboring states' change, prior values adjusted by the nearest counties' change, a distance-weighted average of nearby counties, or a model from local age, income and education.",
    "Error of 1.5 points or less: used. 1.5–3 points: used and flagged lower confidence. Over 3: No data. Filled values, and any score using them, carry an asterisk (*). CDC's own values replace them automatically when restored."
   ]
  },
  {
   "title": "Category Spending",
   "body": "EASI 2025 household spending: prescription drugs for Pharmacy, medical services for everything else. Half per household, half market total. Healthcare spending varies less between markets than other categories, so this part moves rankings modestly. Palm Springs uses the Riverside–San Bernardino metro's rate. Not available by ZIP."
  },
  {
   "title": "Spending Power",
   "body": "Share of households earning $75K+ (Census ACS). Held to 15% because EASI already reflects income."
  },
  {
   "title": "Competition",
   "body": "Category businesses per 10,000 residents, reversed: fewer businesses scores higher (Census County Business Patterns). Not used for Urgent care (Census mixes it with surgery centers and physician offices), Hearing (counted with physical therapists) or Med spa (counted with physician offices); no competitor counts are shown for them. Not used for ZIPs: Census hides ZIP counts under 3."
  },
  {
   "title": "EASI metro layer",
   "body": "Metro view only: 2025 counts and 2030 projections of adults with heart disease, cancer, hearing trouble and vision trouble (EASI), indexed to all U.S. metros combined. Shown, not scored."
  },
  {
   "title": "Underserved",
   "body": "Strong demand (70th percentile+) with few businesses per resident (30th percentile or lower). Shown, not scored. Not shown for categories without a Census business count."
  },
  {
   "title": "Competitor locations",
   "body": "Circles sized by competing businesses in the selected category in each market or ZIP (Census Business Patterns). Counts by area, not addresses. ZIPs with fewer than 3 show no circle. Not offered for Urgent care, Hearing or Med spa."
  },
  {
   "title": "Rank and map by",
   "body": "Market Potential Score (where to spend), spending index (how intensely households spend), total spending (market size in dollars) and households per square mile (prospects a service area can reach)."
  },
  {
   "title": "Households per square mile",
   "body": "Households divided by land area (Census Gazetteer). Not scored; use it to compare reach."
  },
  {
   "title": "ZIPs in a market",
   "body": "Pick a DMA, metro or county, then ZIPs in market. ZIP scores use Consumer Demand (73%) and Spending Power (27%). ZIPs under 500 residents, or mostly group quarters, are shown but not ranked."
  },
  {
   "title": "Advertising response",
   "body": [
    "Trade area view only, after the area is chosen: the percent of the target group and of all U.S. adults who acted on an ad in each of 17 media in the past 30 days (AudienceSCAN 2026). Rates cover everyone in each group, not just media users, and measure response, not reach. National data, the same for every market.",
    "\"Vs. average\" is a percent difference: 53.5% vs. 36.7% is 46% more likely, not 17 points.",
    "The panel follows the radius tool's \"Best prospects for\" preset. Groups: urgent care audience (Urgent care), drug store customers who shop at least twice a week, 14.8% of U.S. adults (Pharmacy), potential dentist switchers (Dental), hearing aid shoppers (Hearing), potential eye doctor switchers (Eye care), physical therapy patients (Chiropractic and PT), psychologist and counseling patients (Behavioral health), Botox and filler clients (Med spa), eldercare and nursing home shoppers (Senior care)."
   ]
  }
