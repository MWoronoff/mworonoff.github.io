<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zip Code Radius Tool - Furniture</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../shared/adtaxi-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body>
<div id="app"><p class="az-loading">Loading the radius tool…</p></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" crossorigin=""></script>
<script src="../shared/radius.js"></script>
<script>
AdtaxiRadius.start({
  title: "Zip Code Radius Tool - Furniture",
  subtitle: "Pick a center ZIP or town and a radius, then choose the buyers you want to reach to see how many live there and which ZIPs over-index.",
  logo: "../shared/adtaxi-logo.svg",
  exportName: "furniture-radius",
  links: [ { label: "Furniture Market Analyzer", url: "./" }, { label: "All analyzers", url: "../analyzers/" } ],
  audienceData: "../shared/audience/zip_audience.json",
  extraData: [ { url: "../shared/audience/zip_audience_legal.json", label: "Home and home value data" } ],
  zipGeo: "../shared/geo/zip/{level}/{id}.json",
  ageSet: "adult",
  radii: [5, 10, 15, 25, 50, 100],
  radiusLabel: "Up to {r} miles",
  filters: ["age", "income5", "home"],
  profileLabel: "Best prospects for",
  profiles: [
    { id: "any", label: "Any furniture", note: "Adults 25–54 with household income of $50K or more.", sel: { age: ["25_34", "35_44", "45_54"], income5: ["50_75", "75_100", "100_150", "150p"] } },
    { id: "living", label: "Sofas and living room", note: "Adults 25–44 with household income of $50K or more.", sel: { age: ["25_34", "35_44"], income5: ["50_75", "75_100", "100_150", "150p"] } },
    { id: "bedroom", label: "Bedroom furniture", note: "Adults 25–44, the ages most often setting up a new home or a child's room.", sel: { age: ["25_34", "35_44"] } },
    { id: "mattress", label: "Mattresses", note: "Adults 18–34, the ages that move most often.", sel: { age: ["18_24", "25_34"] } },
    { id: "dining", label: "Kitchen and dining", note: "Homeowners 35–54.", sel: { age: ["35_44", "45_54"], home: ["ownlt200", "own200_400", "own400_750", "own750p"] } },
    { id: "outdoor", label: "Outdoor and patio", note: "Homeowners 35 and older with household income of $75K or more.", sel: { age: ["35_44", "45_54", "55p"], home: ["ownlt200", "own200_400", "own400_750", "own750p"], income5: ["75_100", "100_150", "150p"] } },
    { id: "baby", label: "Baby and nursery", note: "Adults 25–34, the main age for first-time parents.", sel: { age: ["25_34"] } }
  ],
  methodology: [
    { title: "Furniture prospects", body: "Each preset picks the Census ages, income and homeownership that fit its furniture line. You can change any selection after picking a preset." },
    { title: "Home and home value", body: "Owner and renter shares come from Census by the age of the head of household, so they use each age group's own rate. Home value bands are the share of owner-occupied homes in each value range in the ZIP." }
  ]
});
</script>
</body>
</html>
