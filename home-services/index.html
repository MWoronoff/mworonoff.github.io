 "methodology": [
  {
   "title": "Market Potential Score",
   "body": [
    "Answers one question: where are a home service company's potential customers, and which geographies deserve the most ad dollars?",
    "Market Potential Score = 40% Consumer Demand + 25% Category Spending + 15% Spending Power + 20% Competition. Each part is a percentile (0 to 100) against the other markets at the same level: DMAs against DMAs, metros against metros, ZIPs against the other ZIPs in the same market.",
    "A score isn't computed when one of its parts has no data, rather than guessing."
   ]
  },
  {
   "title": "Services covered",
   "body": "The analyzer covers the home services with EASI household spending data: HVAC, roofing and gutters, plumbing, electrical, painting and wallpaper, and flooring, plus Any home service, which combines them all. Windows and doors, remodeling, landscaping and pest control aren't included, because EASI has no spending data for them."
  },
  {
   "title": "Consumer Demand",
   "body": [
    "The size and need of each service's customer base. Homeowners and home characteristics come from the Census American Community Survey; climate and hail come from NOAA.",
