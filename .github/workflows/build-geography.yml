name: Build geography boundaries

# Run manually from the Actions tab. Downloads Census boundary files (no key needed),
# builds DMA, metro and state shapes for the map, checks every DMA has a shape, and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build boundary files
        run: bash data-build/build_boundaries.sh
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shared/geo
          git diff --cached --quiet || git commit -m "Build geography boundaries"
          git push
