name: Build geography boundaries

# Run manually from the Actions tab. Downloads Census boundary files and tables (no key needed), builds the map
# shapes, the radius tool's audience data and the engine test data, commits the results, and republishes the site.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install pandas
      - name: Build boundary files
        run: bash data-build/build_boundaries.sh
      - name: Build radius audience data
        run: python3 data-build/build_audience.py
      - name: Build engine test page data
        run: python3 data-build/build_engine_test.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shared/geo shared/audience engine-test/data
          git diff --cached --quiet || git commit -m "Build geography, audience and test data"
          git push
      - name: Republish the site
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
