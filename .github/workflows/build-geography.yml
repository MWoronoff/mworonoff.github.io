name: Build geography boundaries

# Run manually from the Actions tab. Downloads Census boundary files and tables, builds the map shapes, the radius
# tool's audience data, the Healthcare analyzer data and the engine test data, commits the results, and republishes
# the site. No API keys are needed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install pandas
      - name: Build boundary files
        run: bash data-build/build_boundaries.sh
      - name: Build radius audience data
        run: python3 data-build/build_audience.py
      - name: Build Healthcare data
        run: python3 data-build/build_healthcare.py
      - name: Build engine test page data
        run: python3 data-build/build_engine_test.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shared/geo shared/audience engine-test/data healthcare/data
          git diff --cached --quiet || git commit -m "Build geography, audience, Healthcare and test data"
          git push
      - name: Republish the site
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
