name: Audit CBP totals (one-time check)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare national vs county-file totals
        run: |
          cd /tmp
          curl -sSfL -A "Mozilla/5.0" -o us.zip https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23us.zip
          curl -sSfL -A "Mozilla/5.0" -o co.zip https://www2.census.gov/programs-surveys/cbp/datasets/2023/cbp23co.zip
          python3 - <<'PY' > out.txt
          import zipfile, csv, io
          codes=['441110','441120','541110','541213','523920','523930','522292','522310','442110','238220','238160','531110','531311','621210','446110','621340','624120','611310']
          def rows(z):
              f=zipfile.ZipFile(z); n=[x for x in f.namelist() if x.endswith('.txt') or x.endswith('.csv')][0]
              return csv.DictReader(io.TextIOWrapper(f.open(n),encoding='latin-1'))
          us={}; cols=None
          for r in rows('us.zip'):
              r={k.lower():v for k,v in r.items()}
              if r['naics'] in codes and r.get('lfo','-') in ('-',''): us[r['naics']]=int(r['est'])
          co={c:0 for c in codes}; sw={c:0 for c in codes}
          for r in rows('co.zip'):
              r={k.lower():v for k,v in r.items()}
              if r['naics'] in codes:
                  co[r['naics']]+=int(r['est'])
                  if r['fipscty']=='999': sw[r['naics']]+=int(r['est'])
          for c in codes: print(c,'US',us.get(c),'counties',co[c],'of which statewide-999',sw[c])
          PY
          cat out.txt
          echo "::notice title=CBP audit::$(sed ':a;N;$!ba;s/\n/%0A/g' out.txt)"
