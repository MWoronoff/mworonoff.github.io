 "methodology": [
  {
   "title": "Market Potential Score",
   "body": [
    "Where are a financial advertiser's likely customers, and which geographies deserve the most ad dollars?",
    "Score = 40% Consumer Demand + 25% Category Spending + 15% Spending Power + 20% Competition. Each part is a percentile (0–100) against markets at the same level. The total is then scaled so the strongest market at each level scores 100 and the weakest 0 (a market’s ZIPs: its best ZIP is 100); rankings don’t change. No score is shown when a part has no data.",
    "Every line has its own Category Spending measure. Tax preparation leaves out Spending Power, since income is already part of its Consumer Demand; its remaining parts keep their relative weights.",
    "Second & investment home buyers leaves out Competition: buyers often live far from where they buy, so the developers and agents near a property don’t compete for them (the same feeder-market logic as the Travel analyzer). Its remaining parts keep their relative weights."
   ]
  },
  {
   "title": "Consumer Demand",
   "body": [
    "Each line's likely customers, count and concentration.",
    "Tax preparation: returns with a paid preparer and their share (IRS), adults 45+ and households earning $75K+ (Census ACS). Wealth management: returns with dividends and their share, the share with capital gains, the share with income of $200K+ (IRS), adults 55+ (Census ACS). Retirement planning: adults 50–64 and their share (Census ACS); the shares of returns with IRA distributions and with pension income (IRS). Home purchase: purchase loans and loans per 1,000 households (HMDA), renters earning $75K+, the share who moved in the past year (Census ACS). Refinance and home equity: refinance and home equity loans and loans per 1,000 owner homes (HMDA), owner homes with a mortgage and their share, households earning $100K+ (Census ACS). Banks: adults, the share who moved in the past year (new residents choose a new bank) and the share of returns with business income (small-business banking). Credit unions: adults, adults 45+ and households earning $75K+. Second & investment home buyers: owner homes worth $300K+ and households earning $100K+ (Census ACS), scored where buyers live, not where they buy. Any property type counts.",
    "A Nielsen Scarborough USA+ 2026 pull of financial products households have or use backs up the current profiles: checking and savings accounts run near average across ages and incomes (77–119), mobile banking leans 25–54 (115–117) and $100K+ (132–153), refinanced mortgages 35–54 (128–143) and $100K+ (166–229), home equity loans 45–64 (139–142) and $100K+ (159–186), and CDs and money market accounts 65+ (163–187) and $250K+ (162–218).",
    "Banks follows the 2026 AudienceSCAN Potential Bank Switchers profile: ages 25–44 (+32–34% vs. all adults), 45–54 (+25%) and 18–24 (+22%), with 65+ 64% below; household income $150K+ (+18%) and $75K–$149K (+8%), with under $35K 23% below; parents of children 2–9 (+56–66%), men (+17%) and city dwellers (+30%). So Banks starts at adults 18–54 earning $75K+.",
    "Home purchase and Refinance follow Nielsen Scarborough USA+ 2026 adults planning each in the next 12 months: home buyers over-index at 25–44 (134–174), $100K+ (117–138), renters (159) and parents (139); refinancers at 25–54 (127–163), $100K+ (151–189), homeowners (147) and parents (175).",
    "The age and income traits follow Nielsen Scarborough USA+ 2026 customer profiles (index 100 = average): tax preparation service users skew 45+ (index 107–135) and $75K+ (110–145); financial planner clients 55+ (137–177; 45–54 only 86); households that refinanced $100K+ (166–229); credit union members 45+ (106–113) and $75K+ (110–123). Retirement planning (55+, $75K+) is confirmed as it was.",
    "Second & investment home buyers is checked against Nielsen Scarborough USA+ 2026 Release 1 households with a second home or other real estate property (7.1% of adults): across its 83 measured DMAs, the line’s DMA score lines up with the ownership rate (rank correlation about 0.5), so read it as a ranking of likely markets, not a forecast. Owners skew $250K+ (index 338), $100K–$249K (156), homeowners (144) and postgraduate degrees (180). The AudienceSCAN 2026 Investment Property Shoppers profile (5.7% of adults plan to buy in the next year) leans 25–44, $150K+, men and city dwellers.",
    "International buyers aren’t scored (no market-level data). NAR’s 2026 International Transactions report (April 2025–March 2026): foreign buyers bought 67,100 U.S. homes, 1.7% of sales, 48% in all cash, median price $465,000. Top origins: Canada 16%, Mexico 14%, China 11%, India 9%, United Kingdom 4%. Top destinations: Florida 20%, California 19%, Texas 12%."
   ]
  },
  {
   "title": "Category Spending",
   "body": "EASI 2025, half per household, half market total. Tax preparation: accounting fees (EASI's measure covers all household accounting fees, of which tax preparation is the largest part). Wealth management: value of stocks, bonds and mutual funds (the investments advisers manage). Retirement planning: contributions to retirement plans (what households put in each year). Home purchase: purchase price of homes bought in the year. Refinance and home equity: estimated market value of owned homes (the value refinancing and equity loans draw on). Banks and Credit unions: the value of savings, checking, money market accounts and CDs (the deposits they compete for). Second & investment home buyers: spending on vacation homes and other lodging plus lodging on trips (EASI; the Travel analyzer’s measures). Shown, not scored: value of retirement plans, checking and bank service charges, change in net property holdings and change in mortgage principal. Palm Springs uses the Riverside–San Bernardino metro's rate. Not available by county or ZIP."
  },
  {
   "title": "Data sources and timing",
   "body": [
    "IRS: Statistics of Income ZIP data, newest tax year (published about three years after). A return stands in for a household; the IRS omits ZIPs with very few returns.",
    "HMDA: owner-occupied loans from the national loan-level file, placed by census tract; tracts crossing ZIP lines are split by land area. About 0.2% of loans have no tract and aren't placed.",
    "Ages, incomes, homeownership, mortgage status and moves: Census ACS 5-year. Population and households: Deluxe."
   ]
  },
  {
   "title": "Spending Power",
   "body": "Share of households earning $75K+ (Census ACS). Second & investment home buyers: share of tax returns with income of $200K+ (IRS)."
  },
  {
   "title": "Competition",
   "body": "Competitors per 10,000 residents, reversed: fewer scores higher (Census County Business Patterns). Tax: tax preparation services. Wealth and Retirement: investment advice and portfolio management firms. Mortgage lines: real estate lenders and mortgage and loan brokers (banks and credit unions also lend, but Census counts them with all their other business). Banks: commercial bank offices and branches. Credit unions: credit union offices and branches. Not used for ZIPs: Census hides ZIP counts under 3. Second & investment home buyers: not used."
  },
  {
   "title": "Underserved",
   "body": "Strong demand (70th percentile+) with few competitors per resident (30th percentile or lower). Shown, not scored. Not shown for Second & investment home buyers, which has no Competition part."
  },
  {

    return el("button", { type: "button", onclick: function () { go(i + 1); } }, [el("span", { class: "rd-n", text: String(i + 1) }), el("span", null, [t[0], el("small", { text: t[1] })])]);
  });
  var stepBar = el("ol", { class: "rd-steps", "aria-label": "Steps" }, stepBtns.map(function (b) { return el("li", null, [b]); }));
  main.insertBefore(stepBar, main.firstChild);
  function levelBtn(lv) { return root.querySelector('[data-level="' + lv + '"]'); }
  function go(n) {
    var s = app.state;
    if (n === 1) { if (app.mode === "radius") app.closeRadius(); app.subSel.focus(); return; }
    if (n === 2) { var b = levelBtn("dma"); if (b) b.click(); return; }
    if (n === 3) {
      if (app.mode === "radius") app.closeRadius();
      if (!s.parent && s.area && ["dma", "metro", "county"].indexOf(s.level) >= 0) { app.lookInside(s.level, s.area); return; }
      if (!s.parent) { var d = levelBtn("dma"); if (d) d.click(); }
      return;
    }
    if (n === 4) { var p = levelBtn("plan"); if (p && !p.disabled) p.click(); else { var r = levelBtn("radius"); if (r) r.click(); } }
  }
  function cur() { if (app.mode === "radius") return 4; if (app.state.parent) return 3; return 2; }
  function paintSteps() {
    var c = cur();
    stepBtns.forEach(function (b, i) {
      var n = i + 1; b.className = n < c ? "rd-done" : n === c ? "rd-now" : "";
      b.querySelector(".rd-n").textContent = n < c ? "✓" : String(n);
      if (n === c) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    stepBar.hidden = app.tab && app.tab !== "markets";
  }
  setInterval(paintSteps, 400); paintSteps();

  // 4. More options: Rank and map by, Show, and picking several markets
  var rankField = app.rankSel.closest("label"), showField = app.showSel.closest("label");
  var pickBox = el("input", { type: "checkbox", onchange: function () { doc.body.classList.toggle("rd-pick", this.checked); } });
  var more = el("div", { class: "rd-more", hidden: "" }, [rankField, showField, el("label", { class: "rd-check" }, [pickBox, "Tick several markets to combine into one trade area"])]);
  var moreBtn = el("button", { type: "button", class: "rd-link rd-moretoggle", "aria-expanded": "false", text: "More options ▾",
    onclick: function () { var open = more.hidden; more.hidden = !open; moreBtn.setAttribute("aria-expanded", String(open)); moreBtn.textContent = open ? "Fewer options ▴" : "More options ▾"; } });
  controls.appendChild(moreBtn); controls.appendChild(more);
  if (app.basket && app.basket.length) { pickBox.checked = true; doc.body.classList.add("rd-pick"); }

  // 5. List: search beside the title, five columns with "More columns" for the rest
  var head = root.querySelector(".az-table-head"), table = root.querySelector(".az-table");
  var searchField = app.search.closest("label"); searchField.querySelector("span").textContent = "Find";
  var colsBtn = el("button", { type: "button", class: "rd-link", text: "More columns", onclick: function () {
    var all = table.classList.toggle("rd-allcols"); colsBtn.textContent = all ? "Fewer columns" : "More columns"; } });
  head.appendChild(el("div", { class: "rd-tabletools" }, [searchField, colsBtn]));
  var KEEP = 3;   // measure columns shown by default (Score plus two)
  function markCols() {
    var ths = app.thead.querySelectorAll("th"), extra = [], m = 0;
    [].forEach.call(ths, function (th, i) {
      if (!th.querySelector("button")) return;
      var hide = m >= KEEP && th.getAttribute("aria-sort") == null; m++;
      th.classList.toggle("rd-x", hide); if (hide) extra.push(i);
    });
    [].forEach.call(app.tbody.rows, function (tr) { [].forEach.call(tr.cells, function (td, i) { td.classList.toggle("rd-x", extra.indexOf(i) >= 0); }); });
    colsBtn.hidden = m <= KEEP;
  }
  new MutationObserver(markCols).observe(app.tbody, { childList: true });
  markCols();
})();
</script>
</body>
</html>
