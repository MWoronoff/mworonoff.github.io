<script>
AdtaxiAnalyzer.start({
 "title": "Financial Market Analyzer",
 "subtitle": "Where financial advertisers' best prospects are: Market Potential Scores for DMAs, metros, counties and ZIPs across five financial lines, to focus ad dollars on the highest-potential geographies.",
 "logo": "../shared/adtaxi-logo.svg",
 "exportName": "financial",
 "notice": "Preview for review.",
 "links": [
  {
   "label": "Home",
   "url": "../analyzers/"
  }
 ],
 "radiusDefault": 10,
 "radiusProfiles": true,
 "defaultLevel": "dma",
 "usMapLevel": "dma",
 "levels": {
  "us": {
   "label": "U.S.",
   "data": "data/us.json"
  },
  "dma": {
   "label": "DMA",
   "data": "data/dma.json",
   "geo": "../shared/geo/dma.topo.json",
   "idField": "dma_code"
  },
  "metro": {
   "label": "Metro",
   "data": "data/metro.json",
   "geo": "../shared/geo/metro.topo.json",
   "idField": "cbsa_code"
  },
  "county": {
   "label": "County",
   "data": "data/county.json",
   "geo": "../shared/geo/county.topo.json",
   "idField": "fips"
  },
  "zip": {
   "label": "ZIPs in market",
   "data": "data/zip/{level}/{id}.json",
   "geo": "../shared/geo/zip/{level}/{id}.json",
   "idField": "zip"
  }
 },
 "statesGeo": "../shared/geo/states.topo.json",
 "subcategoryLabel": "Financial line",
 "subcategories": [
  {
   "id": "tax",
   "label": "Tax preparation"
  },
  {
   "id": "wealth",
   "label": "Wealth management"
  },
  {
   "id": "retire",
   "label": "Retirement planning"
  },
  {
   "id": "purchase",
   "label": "Home purchase mortgage"
  },
  {
   "id": "refi",
   "label": "Refinance and home equity"
  }
 ],
 "measures": [
  {
   "key": "score",
   "label": "Market Potential Score",
   "format": "score",
   "short": "Score",
   "help": "0 to 100. Weighted blend of Consumer Demand (40%), Spending Power (15%) and Competition (20%), re-weighted to 100% (53%, 20% and 27%), each a percentile against the other markets at the same level. Tax preparation leaves out Spending Power, because paid-preparer and Earned Income Credit households skew toward moderate incomes (Demand 67%, Competition 33%). ZIPs rank against the other ZIPs in the same market using Consumer Demand and Spending Power only. Counties under 10,000 residents aren't ranked.",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ]
  },
  {
   "key": "demand",
   "label": "Consumer Demand",
   "format": "score",
   "short": "Demand",
   "help": "Average of the percentiles for this line's prospect inputs (see How scores work).",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ]
  },
  {
   "key": "spend",
   "label": "Spending Power",
   "format": "score",
   "short": "Spend",
   "subs": [
    "wealth",
    "retire",
    "purchase",
    "refi"
   ],
   "help": "Percentile of the share of households earning $75K or more.",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ]
  },
  {
   "key": "comp",
   "label": "Competition",
   "format": "score",
   "short": "Compete",
   "help": "Percentile of competing businesses per 10,000 residents, reversed: fewer competitors scores higher, since each ad dollar faces less competition.",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county"
   ]
  },
  {
   "key": "density",
   "label": "Households per square mile",
   "format": "int",
   "short": "HH/sq mi",
   "help": "Households divided by land area (Census Gazetteer). Denser markets put more prospects inside each service area and radius."
  },
  {
   "key": "prep",
   "label": "Returns with a paid preparer",
   "format": "int",
   "subs": [
    "tax"
   ],
   "help": "IRS individual returns signed by a paid preparer. A return stands in for a household."
  },
  {
   "key": "prep_share",
   "label": "Share of returns with a paid preparer",
   "format": "pct",
   "subs": [
    "tax"
   ]
  },
  {
   "key": "eitc_share",
   "label": "Share of returns claiming the Earned Income Credit",
   "format": "pct",
   "subs": [
    "tax"
   ],
   "help": "Earned Income Credit filers are among the heaviest users of paid preparers."
  },
  {
   "key": "selfemp_share",
   "label": "Share of returns with self-employment income",
   "format": "pct",
   "subs": [
    "tax"
   ],
   "help": "Business or professional income (Schedule C): returns that are more complex to file. Shown, not scored."
  },
  {
   "key": "div",
   "label": "Returns with dividend income",
   "format": "int",
   "subs": [
    "wealth"
   ]
  },
  {
   "key": "div_share",
   "label": "Share of returns with dividends",
   "format": "pct",
   "subs": [
    "wealth"
   ]
  },
  {
   "key": "cg_share",
   "label": "Share of returns with capital gains",
   "format": "pct",
   "subs": [
    "wealth"
   ]
  },
  {
   "key": "hi200_share",
   "label": "Share of returns with income of $200K+",
   "format": "pct",
   "subs": [
    "wealth"
   ]
  },
  {
   "key": "a50_64",
   "label": "Adults 50–64",
   "format": "int",
   "subs": [
    "retire"
   ],
   "help": "Pre-retirees, from the Census American Community Survey."
  },
  {
   "key": "a50_64_share",
   "label": "Share of adults who are 50–64",
   "format": "pct",
   "subs": [
    "retire"
   ]
  },
  {
   "key": "ira_share",
   "label": "Share of returns with IRA distributions",
   "format": "pct",
   "subs": [
    "retire"
   ]
  },
  {
   "key": "pens_share",
   "label": "Share of returns with pension or annuity income",
   "format": "pct",
   "subs": [
    "retire"
   ]
  },
  {
   "key": "a65p_share",
   "label": "Share of residents 65+",
   "format": "pct",
   "subs": [
    "retire"
   ],
   "help": "Shown, not scored."
  },
  {
   "key": "purch",
   "label": "Home purchase loans",
   "format": "int",
   "subs": [
    "purchase"
   ],
   "help": "HMDA first-lien home purchase loans made on owner-occupied homes in the year."
  },
  {
   "key": "purch_rate",
   "label": "Home purchase loans per 1,000 households",
   "format": "dec1",
   "subs": [
    "purchase"
   ]
  },
  {
   "key": "rent75",
   "label": "Renter households earning $75K+",
   "format": "int",
   "subs": [
    "purchase"
   ],
   "help": "Likely first-time buyers: renters with incomes high enough to buy."
  },
  {
   "key": "rent75_share",
   "label": "Share of renter households earning $75K+",
   "format": "pct",
   "subs": [
    "purchase"
   ]
  },
  {
   "key": "mover_share",
   "label": "Share who moved in the past year",
   "format": "pct",
   "subs": [
    "purchase"
   ]
  },
  {
   "key": "refieq",
   "label": "Refinance and home equity loans",
   "format": "int",
   "subs": [
    "refi"
   ],

  {
   "key": "refieq_rate",
   "label": "Refinance and home equity loans per 1,000 owner homes",
   "format": "dec1",
   "subs": [
    "refi"
   ]
  },
  {
   "key": "refi",
   "label": "Refinance loans",
   "format": "int",
   "subs": [
    "refi"
   ]
  },
  {
   "key": "equity",
   "label": "Home equity loans and lines",
   "format": "int",
   "subs": [
    "refi"
   ]
  },
  {
   "key": "mortg",
   "label": "Owner homes with a mortgage",
   "format": "int",
   "subs": [
    "refi"
   ],
   "help": "Owner-occupied homes with a mortgage or home equity loan: the people who can refinance or borrow against equity."
  },
  {
   "key": "mortg_share",
   "label": "Share of owner homes with a mortgage",
   "format": "pct",
   "subs": [
    "refi"
   ]
  },
  {
   "key": "val300_share",
   "label": "Owner homes worth $300K+",
   "format": "pct",
   "subs": [
    "refi"
   ],
   "help": "More equity to borrow against. Shown, not scored."
  },
  {
   "key": "est",
   "label": "Competing businesses",
   "format": "int",
   "short": "Competitors",
   "help": "Tax preparation: tax preparation services. Wealth management and Retirement planning: investment advice and portfolio management firms. Mortgage lines: real estate credit lenders and mortgage and loan brokers (banks and credit unions also lend, but Census counts them together with all their other business). DMAs, metros and the U.S. use complete County Business Patterns counts. In the ZIP view, Census doesn't publish a ZIP's count when it has fewer than 3, so those show as 0.",
   "perSub": true
  },
  {
   "key": "per10k",
   "label": "Competing businesses per 10,000 residents",
   "format": "dec2",
   "short": "Per 10K",
   "perSub": true
  },
  {
   "key": "growth",
   "label": "One-year growth in competing businesses",
   "format": "pct",
   "short": "Growth",
   "help": "Change from the prior Business Patterns year. Blank where there were fewer than 3.",
   "perSub": true
  },
  {
   "key": "under",
   "label": "Underserved",
   "format": "text",
   "short": "Underserved",
   "help": "Strong prospect demand (70th percentile or higher) but few competing businesses per resident (30th percentile or lower). Shown, not scored.",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county"
   ]
  },
  {
   "key": "population",
   "label": "Population",
   "format": "int"
  },
  {
   "key": "households",
   "label": "Households",
   "format": "int"
  },
  {
   "key": "inc75_share",
   "label": "Households earning $75K+",
   "format": "pct"
  }
 ],
 "rankBy": [
  "score",
  "prep",
  "prep_share",
  "div",
  "hi200_share",
  "a50_64",
  "ira_share",
  "purch",
  "purch_rate",
  "refieq",
  "mortg",
  "density"
 ],
 "defaultRank": "score",
 "components": [
  "demand",
  "spend",
  "comp"
 ],
 "detailMeasures": [
  "density",
  "est",
  "per10k",
  "growth",
  "under",
  "population",
  "households",
  "prep",
  "prep_share",
  "eitc_share",
  "selfemp_share",
  "div",
  "div_share",
  "cg_share",
  "hi200_share",
  "a50_64",
  "a50_64_share",
  "ira_share",
  "pens_share",
  "a65p_share",
  "purch",
  "purch_rate",
  "rent75",
  "rent75_share",
  "mover_share",
  "refieq",
  "refieq_rate",
  "refi",
  "equity",
  "mortg",
  "mortg_share",
  "val300_share",
  "inc75_share"
 ],
 "tableColumns": [
  "score",
  "density",
  "population",
  "under"
 ],
 "methodology": [
  {
   "title": "Market Potential Score",
   "body": [
    "Answers one question: where are a financial advertiser's best prospects, and which geographies deserve the most ad dollars?",
    "Market Potential Score = 40% Consumer Demand + 15% Spending Power + 20% Competition, re-weighted to 100% (53%, 20% and 27%). Each part is a percentile (0 to 100) against the other markets at the same level: DMAs against DMAs, metros against metros, ZIPs against the other ZIPs in the same market. A Category Spending part (25%) will be added when Adtaxi's EASI spending data is in.",
    "Tax preparation leaves out Spending Power: paid-preparer and Earned Income Credit households skew toward moderate incomes, so rewarding high incomes would point away from the prospects.",
    "A score isn't computed when one of its parts has no data, rather than guessing."
   ]
  },
  {
   "title": "Consumer Demand",
   "body": [
    "Each line has its own prospect inputs, combining how many prospects a market has with how concentrated they are.",
    "Tax preparation: returns with a paid preparer, their share of all returns, and the share claiming the Earned Income Credit (IRS).",
    "Wealth management: returns with dividend income, the share with dividends, the share with capital gains and the share with income of $200K or more (IRS).",
    "Retirement planning: adults 50–64 and their share of adults (Census), and the shares of returns with IRA distributions and with pension or annuity income (IRS).",
    "Home purchase mortgage: home purchase loans made in the year and per 1,000 households (HMDA), renter households earning $75K or more, and the share of residents who moved in the past year (Census).",
    "Refinance and home equity: refinance and home equity loans made in the year and per 1,000 owner homes (HMDA), and owner homes with a mortgage and their share (Census)."
   ]
  },
  {
   "title": "Data sources and timing",
   "body": [
    "IRS figures are from the IRS Statistics of Income ZIP Code data, the newest tax year published (the IRS releases ZIP data about three years after the tax year). A tax return stands in for a household; ZIPs with very few returns aren't published by the IRS.",
    "Mortgage loans are from the Home Mortgage Disclosure Act (HMDA) national loan-level file, counting loans made on owner-occupied homes. Each loan is placed by its census tract; tracts that cross ZIP lines are split by land area. A small share of loans has no tract and isn't placed.",
    "Ages, incomes, homeownership, mortgage status and moves are from the Census American Community Survey 5-year estimates. Population and households are from the Deluxe ZIP file."
   ]
  },
  {
   "title": "Spending Power",
   "body": "Share of households earning $75K or more, from the Census American Community Survey."
  },
  {
   "title": "Competition",
   "body": "Competing businesses per 10,000 residents, reversed: markets with fewer competitors score higher. Tax preparation uses tax preparation services; Wealth management and Retirement planning use investment advice and portfolio management firms; the mortgage lines use real estate credit lenders and mortgage and loan brokers. Banks and credit unions also make mortgages, but Census counts them in one industry with all their other business, so they aren't included. Counts are Census County Business Patterns. Not used in ZIP scores, because Census hides ZIP counts under 3."
  },
  {
   "title": "Underserved",
   "body": "Flags markets with strong prospect demand (70th percentile or higher) but few competing businesses per resident (30th percentile or lower). Shown, not scored."
  },
  {
   "title": "Advertising rules for financial products",
   "body": [
    "Meta and Google restrict targeting for financial products and services in the U.S., including credit, mortgages, banking, investment services and insurance: no targeting by ZIP code, age or gender, and on Meta a location must cover at least a 15-mile radius. Use this analyzer's market and ZIP rankings to choose markets and to plan channels that allow geographic targeting, such as streaming TV, programmatic display and direct mail.",
    "Race, ethnicity and sex are not used anywhere in these scores."
   ]
  },
  {
   "title": "Households per square mile",
   "body": "Households divided by land area from the Census Gazetteer. It isn't part of the score; use it to compare how many prospects a service area or radius can reach."
  },
  {
   "title": "ZIPs in a market",
   "body": "Pick a DMA, metro or county, then choose ZIPs in market. ZIP scores use Consumer Demand and Spending Power, reweighted to 73% and 27% (Tax preparation: Consumer Demand only). ZIPs with fewer than 500 residents are shown but not ranked."
  },
  {
   "title": "Advertising response",
   "body": [
    "In the Radius view, once you pick a center and a radius, a panel under the radius map shows the percent of the target group and of all U.S. adults who saw or heard an ad on each of 17 media that led them to take action in the past 30 days (AudienceSCAN's \"responded last 30 days\"). Percentages are based on everyone in each group, not only people who use that medium, and they are response rates, not reach. It's national data, so it's the same for every market. \"Vs. average\" is a percent difference: 37.8% vs. 35.9% is 5% more likely, not 1.9 points.",
    "Tax preparation uses AudienceSCAN's accounting and tax service clients. The other financial lines show the panel once their AudienceSCAN data is added.",
    "It comes after the geography on purpose: first find where the prospects are, then see how that target group responds to advertising."
   ]
  }
 ],
 "sources": [
  {
   "label": "IRS Statistics of Income, individual income tax ZIP Code data",
   "url": "https://www.irs.gov/statistics/soi-tax-stats-individual-income-tax-statistics-zip-code-data-soi"
  },
  {
   "label": "FFIEC/CFPB Home Mortgage Disclosure Act (HMDA) national loan-level data",
   "url": "https://ffiec.cfpb.gov/data-publication/"
  },
  {
   "label": "Census American Community Survey 5-year"
  },
  {
   "label": "Census ZIP and County Business Patterns",
   "url": "https://www.census.gov/programs-surveys/cbp.html"
  },
  {
   "label": "Deluxe ZIP file (Q4 2025)"
  },
  {
   "label": "ZIP-level DMA list",
   "url": "https://github.com/BritCrit/dma_county_zip"
  }
 ],
 "sourcesNote": "Tax return measures are IRS; mortgage loans are HMDA; ages, incomes, homeownership, mortgage status and moves are Census ACS; competitor counts are Census Business Patterns; population and households are from the Deluxe ZIP file.",
 "radius": true,
 "adResponse": {
  "title": "How your target group responds to advertising",
  "source": "2026 AudienceSCAN® study",
  "note": "National survey data: the percent who saw or heard an ad of each type that led them to take action in the past 30 days. Percentages are based on all U.S. adults and on everyone in the target group, not on users of each medium. \"Vs. average\" is how much more likely the target group is to have responded than all U.S. adults (a percent difference, not percentage points). The same national figures apply to every market. Shown for financial lines with AudienceSCAN data.",
  "subs": {
   "tax": {
    "short": "Tax service clients",
    "audience": "accounting and tax service clients",
    "rows": [
     [
      "Ad on a social network",
      37.8,
      35.9
     ],
     [
      "Ad on search results pages (like on Google, Yahoo or Bing)",
      37.1,

     ],
     [
      "Television (traditional, including cable or satellite subscription)",
      36.0,
      34.7
     ],
     [
      "Streaming TV advertising (such as Hulu, Pluto TV or YouTube TV)",
      35.8,
      36.7
     ],
     [
      "Mobile phone app or text message",
      34.7,
      36.6
     ],
     [
      "Ads/Coupons in your mailbox",
      32.2,
      29.9
     ],
     [
      "Emailed ad or newsletter",
      31.2,
      28.6
     ],
     [
      "Ad that plays before or during the video you want to watch",
      31.0,
      31.1
     ],
     [
      "Online display ads (banners and pop-up ads)",
      30.3,
      30.0
     ],
     [
      "Advertising circulars in your mailbox or inserted in the newspaper",
      29.2,
      27.2
     ],
     [
      "Text link ad on a website",
      27.1,
      27.3
     ],
     [
      "Newspaper (print, online, mobile or tablet)",
      25.4,
      23.5
     ],
     [
      "Radio (over-the-air, online, mobile or tablet)",
      25.2,

     ],
     [
      "Outdoor ad/sign/billboard/transit",

     ],
     [
      "Magazine (print, online, mobile or on tablet)",
      22.4,

     ],
     [
      "Ad on a podcast",
      21.1,
      22.7
     ],
     [
      "Ads at movie theater",
      21.1,
      21.5
     ]
    ]
   }
  }
 }
});
</script>
