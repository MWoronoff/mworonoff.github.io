 "methodology": [
  {
   "title": "Market Potential Score",
   "body": [
    "Where are a financial advertiser's best prospects, and which geographies deserve the most ad dollars?",
    "Score = 40% Consumer Demand + 25% Category Spending + 15% Spending Power + 20% Competition. Each part is a percentile (0–100) against markets at the same level. No score is shown when a part has no data.",
    "Category Spending applies to Wealth management and Retirement planning only (no matching EASI measure for the others); Tax preparation also leaves out Spending Power (its clients skew to moderate incomes). Remaining parts keep their relative weights."
   ]
  },
  {
   "title": "Consumer Demand",
   "body": [
    "Each line's prospects, count and concentration.",
    "Tax preparation: returns with a paid preparer, their share, and the share claiming the Earned Income Credit (IRS). Wealth management: returns with dividends and their share, the share with capital gains, the share with income of $200K+ (IRS). Retirement planning: adults 50–64 and their share (Census ACS); the shares of returns with IRA distributions and with pension income (IRS). Home purchase: purchase loans and loans per 1,000 households (HMDA), renters earning $75K+, the share who moved in the past year (Census ACS). Refinance and home equity: refinance and home equity loans and loans per 1,000 owner homes (HMDA), owner homes with a mortgage and their share (Census ACS)."
   ]
  },
  {
   "title": "Category Spending",
   "body": "EASI 2025, half per household, half market total. Wealth management: value of retirement plans (assets households hold). Retirement planning: change in value of retirement plans (what households add). Palm Springs uses the Riverside–San Bernardino metro's rate. Not available by county or ZIP."
  },
  {
   "title": "Data sources and timing",
   "body": [
    "IRS: Statistics of Income ZIP data, newest tax year (published about three years after). A return stands in for a household; the IRS omits ZIPs with very few returns.",
    "HMDA: owner-occupied loans from the national loan-level file, placed by census tract; tracts crossing ZIP lines are split by land area. About 0.2% of loans have no tract and aren't placed.",
    "Ages, incomes, homeownership, mortgage status and moves: Census ACS 5-year. Population and households: Deluxe."
   ]
  },
  {
   "title": "Spending Power",
   "body": "Share of households earning $75K+ (Census ACS)."
  },
  {
   "title": "Competition",
   "body": "Competitors per 10,000 residents, reversed: fewer scores higher (Census County Business Patterns). Tax: tax preparation services. Wealth and Retirement: investment advice and portfolio management firms. Mortgage lines: real estate lenders and mortgage and loan brokers (banks and credit unions also lend, but Census counts them with all their other business). Not used for ZIPs: Census hides ZIP counts under 3."
  },
  {
   "title": "Underserved",
   "body": "Strong prospect demand (70th percentile+) with few competitors per resident (30th percentile or lower). Shown, not scored."
  },
  {
   "title": "Map toggles",
   "body": [
    "Competitor locations, bank branches (FDIC Summary of Deposits, June 30) and credit union branches and main offices (NCUA quarterly Call Report; ATMs and shared branches left out). Circles are sized on one scale, so equal circles mean equal counts. Counts by area, not addresses. Shown, not scored.",
    "Census doesn't publish ZIP competitor counts under 3; those ZIPs show no competitor circle."
   ]
  },
  {
   "title": "Rank and map by",
   "body": "Market Potential Score, EASI retirement plan spending (index and total) for Wealth and Retirement, each line's key prospect measures, and households per square mile."
  },
  {
   "title": "Advertising rules",
   "body": "Meta and Google restrict U.S. targeting for financial products (credit, mortgages, banking, investments, insurance): no ZIP, age or gender targeting, and Meta requires at least a 15-mile radius. Use these rankings to choose markets and plan channels that allow geographic targeting: streaming TV, programmatic display, direct mail. Race, ethnicity and sex aren't used in any score."
  },
  {
   "title": "Households per square mile",
   "body": "Households divided by land area (Census Gazetteer). Not scored; use it to compare reach."
  },
  {
   "title": "ZIPs in a market",
   "body": "Pick a DMA, metro or county, then ZIPs in market. ZIP scores use Consumer Demand (73%) and Spending Power (27%); Tax preparation uses Consumer Demand only. ZIPs under 500 residents, or mostly group quarters, are shown but not ranked."
  },
  {
   "title": "Advertising response",
   "body": [
    "Trade area view only, after the area is chosen: the percent of the target group and of all U.S. adults who acted on an ad in each of 17 media in the past 30 days (AudienceSCAN 2026). Rates cover everyone in each group, not just media users, and measure response, not reach. National data, the same for every market.",
    "\"Vs. average\" is a percent difference: 53.5% vs. 36.7% is 46% more likely, not 17 points.",
    "The panel follows the radius tool's \"Best prospects for\" preset. Groups: accounting and tax service clients (Tax), financial and retirement planning clients (Wealth, Retirement), homebuyers buying a larger or smaller home (Home purchase), mortgage refinancing customers (Refinance). For financial planning clients, AudienceSCAN gives the group's percentages only; the all-adults figures are the same national figures used everywhere."
   ]
  }
 ],

  "source": "2026 AudienceSCAN® study",
  "note": "National survey data: the percent who saw or heard an ad of each type that led them to take action in the past 30 days. Percentages are based on all U.S. adults and on everyone in the target group, not on users of each medium. \"Vs. average\" is how much more likely the target group is to have responded than all U.S. adults (a percent difference, not percentage points). The same national figures apply to every market. For financial and retirement planning clients, AudienceSCAN gives the target group's percentages only; the all-adults figures are the same national figures used for every other group.",
