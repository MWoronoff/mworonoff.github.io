  {
   "title": "Consumer Demand",
   "body": [
    "The size and concentration of each type of school's likely students, from the Census American Community Survey. Four-year colleges: people 15-24, their share of the population, and households earning $100K+. Community colleges: people 18-24, plus adults 25+ whose highest education is a high school diploma or GED, in number and share. Trade and career schools: adults 18-34 without a college degree, in number and share, and the unemployment rate. Graduate and professional programs: adults 25+ whose highest degree is a bachelor's, in number and share, and households earning $100K+. Adult and online degree completion: adults 25-64 with some college but no degree, in number and share."
   ]
  },
  {
   "title": "Category Spending",
   "body": "EASI 2025 estimates of household spending on college tuition, the same for every type of school. Half the weight goes to spending per household and half to the market's total, which is EASI's per-household spending times this site's household count. EASI counts Palm Springs inside Los Angeles, so the provisional Palm Springs DMA uses the Riverside–San Bernardino metro's rate. Not available by ZIP."
  },
  {
   "title": "Spending Power",
   "body": "Share of households earning $75K or more, from the Census American Community Survey. Kept at 15% because EASI spending already reflects income."
  },
  {
   "title": "Competition",
   "body": "Competing schools of the selected type per 100,000 residents, reversed: markets with fewer competing schools score higher. Schools come from the Department of Education's IPEDS directory, which lists every college, university, community college and career school that takes federal student aid, at its campus address. Four-year: public and private schools whose highest award is a bachelor's or higher, excluding colleges that are mainly two-year. Community colleges: public two-year colleges and public colleges that are mainly two-year. Trade and career: private two-year schools and all schools with programs under two years. Graduate: schools awarding master's, professional or doctoral degrees. Adult and online: all degree-granting schools. Schools outside federal aid, such as some coding bootcamps, aren't included. Online schools count at their headquarters, though they enroll nationwide."
  },
  {
   "title": "Underserved",
   "body": "Flags markets with strong student demand (70th percentile or higher) but few competing schools per resident (30th percentile or lower). It's shown as a pitch for schools weighing a new campus or a recruiting push, not counted in the score."
  },
  {
   "title": "Competing schools",
   "body": "Switch on Show competing schools to put a circle on each market (or each ZIP in the ZIP view) sized by the number of schools of the selected type, from the Department of Education's IPEDS directory."
  },
  {
   "title": "Measures shown for each type of school",
   "body": "Rank and map by offers four choices, each answering a different question: the Market Potential Score (where to put the money overall), the college tuition spending index vs. U.S. (how intensely households spend on college), total tuition spending (how big the market is in dollars) and households per square mile (how many prospects a recruiting area can reach). Market details add Consumer Demand and the other parts of the score, plus the student, income and school measures that relate to the selected type of school."
  },
  {
   "title": "Households per square mile",
   "body": "Households divided by land area from the Census Gazetteer, for each ZIP, metro and DMA. It isn't part of the score; use it to compare how many prospects a service area or radius can reach."
  },
  {
   "title": "ZIPs in a market",
   "body": "Pick a DMA, metro or county, then choose ZIPs in market. ZIP scores use Consumer Demand and Spending Power, reweighted to 73% and 27%. ZIPs with fewer than 500 residents are shown but not ranked. The ZIP view still shows how many competing schools sit in each ZIP. For recruiting across a wider area, use the Zip Code Radius Tool, which reaches up to 300 miles."
  },
  {
   "title": "Advertising response",
   "body": [
    "In the Radius view, once you pick a center and a radius, a panel under the radius map shows the percent of the selected school type's target group and of all U.S. adults who saw or heard an ad on each of 17 media that led them to take action in the past 30 days (AudienceSCAN's \"responded last 30 days\"). Percentages are based on everyone in each group, not only people who use that medium, and they are response rates, not reach. It's national data, so it's the same for every market.",
    "Target groups: full-time students for four-year colleges and trade and career schools; part-time students for community colleges; college tuition buyers for graduate and professional programs; online students for adult and online degree completion.",
    "\"Vs. average\" is a percent difference: 50.7% vs. 35.9% is 41% more likely, not 15 points. Sorting by response lists the media with the highest response rates first; sorting by vs. average lists first the media where the target group's response rate is furthest above all U.S. adults.",
    "It comes after the geography on purpose: first find where the prospects are, then see how that target group responds to advertising. The panel follows the radius tool's \"Best prospects for\" preset."
   ]
  }
