<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Market Analyzer</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../shared/adtaxi-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="../shared/engine.css">
</head>
<body>
<div id="app"><p class="az-loading">Loading the Apartment Market Analyzer…</p></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" crossorigin=""></script>
<script src="../shared/engine.js"></script>
<script>
AdtaxiAnalyzer.start({
 "title": "Apartment Market Analyzer",
 "subtitle": "Where apartment advertisers' prospective residents are: Market Potential Scores for DMAs, metros, counties and ZIPs across six rental categories, to focus ad dollars on the highest-potential geographies.",
 "logo": "../shared/adtaxi-logo.svg",
 "exportName": "apartments",
 "notice": "Preview for review.",
 "links": [
  {
   "label": "Zip Code Radius Tool",
   "url": "radius.html"
  },
  {
   "label": "All analyzers",
   "url": "../analyzers/"
  }
 ],
 "radiusPage": "radius.html",
 "radiusDefault": 10,
 "radiusProfiles": true,
 "defaultLevel": "dma",
 "usMapLevel": "dma",
 "levels": {
  "us": {
   "label": "U.S.",
   "data": "data/us.json"
  },
  "dma": {
   "label": "DMA",
   "data": "data/dma.json",
   "geo": "../shared/geo/dma.topo.json",
   "idField": "dma_code"
  },
  "metro": {
   "label": "Metro",
   "data": "data/metro.json",
   "geo": "../shared/geo/metro.topo.json",
   "idField": "cbsa_code"
  },
  "county": {
   "label": "County",
   "data": "data/county.json",
   "geo": "../shared/geo/county.topo.json",
   "idField": "fips"
  },
  "zip": {
   "label": "ZIPs in market",
   "data": "data/zip/{level}/{id}.json",
   "geo": "../shared/geo/zip/{level}/{id}.json",
   "idField": "zip"
  }
 },
 "statesGeo": "../shared/geo/states.topo.json",
 "subcategoryLabel": "Rental category",
 "subcategories": [
  {
   "id": "all",
   "label": "All apartments"
  },
  {
   "id": "luxury",
   "label": "Luxury / Class A"
  },
  {
   "id": "mid",
   "label": "Mid-market / workforce"
  },
  {
   "id": "affordable",
   "label": "Affordable housing"
  },
  {
   "id": "student",
   "label": "Student housing"
  },
  {
   "id": "senior",
   "label": "Active adult / 55+"
  }
 ],
 "measures": [
  {
   "key": "score",
   "label": "Market Potential Score",
   "format": "score",
   "short": "Score",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ],
   "help": "0 to 100. Weighted blend of Consumer Demand (40%), Category Spending (25%), Spending Power (15%) and Competition (20%), each a percentile against the other markets at the same level. Affordable housing and Student housing leave out Spending Power, because those renters aren't defined by what they can pay; the remaining parts keep their relative weights. ZIPs rank against the other ZIPs in the same market using Consumer Demand and Spending Power only (no EASI spending by ZIP, and Census hides small ZIP business counts). Counties rank against all U.S. counties without Category Spending (EASI isn't published by county), so the other parts are re-weighted to 100%; counties under 10,000 residents aren't ranked."
  },
  {
   "key": "demand",
   "label": "Consumer Demand",
   "format": "score",
   "short": "Demand",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ],
   "help": "Average of the percentiles for this category's renter inputs (see How scores work)."
  },
  {
   "key": "category",
   "label": "Category Spending",
   "format": "score",
   "short": "Spending",
   "perSub": true,
   "levels": [
    "dma",
    "metro"
   ],
   "help": "Half EASI total rent spending (how big the market is) and half Census rent per household (how much households here spend on rent), as percentiles."
  },
  {
   "key": "spend",
   "label": "Spending Power",
   "format": "score",
   "short": "Power",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ],
   "help": "Percentile of the share of renter households in this category's income range: $50K+ for All apartments, Mid-market and Active adult; $100K+ for Luxury.",
   "subs": [
    "all",
    "luxury",
    "mid",
    "senior"
   ]
  },
  {
   "key": "comp",
   "label": "Competition",
   "format": "score",
   "short": "Compete",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county"
   ],
   "help": "Percentile of residential landlords and property managers per 10,000 renter households, reversed: fewer competing landlords and managers scores higher, since each ad dollar faces less competition."
  },
  {
   "key": "rent_idx",
   "label": "Rent spending index vs. U.S.",
   "format": "index",
   "short": "Rent idx",
   "levels": [
    "us",
    "dma",
    "metro",
    "county"
   ],
   "help": "Annual rent per household (typical rent x 12 x share of households renting) divided by the U.S. figure, times 100. Above 100 means households here spend more on rent than average. From Census rents and renter counts."
  },
  {
   "key": "easi_total",
   "label": "Total rent spending, est. annual",
   "format": "moneyM",
   "short": "Total $",
   "levels": [
    "us",
    "dma",
    "metro"
   ],
   "help": "EASI 2025 rent spending per household times the households in this market: the size of the prize.",
   "hideWhenUnavailable": true
  },
  {
   "key": "density",
   "label": "Households per square mile",
   "format": "int",
   "short": "HH/sq mi",
   "help": "Households divided by land area (Census Gazetteer). Denser markets put more prospects inside each service area and radius."
  },
  {
   "key": "rent",
   "label": "Typical monthly rent",
   "format": "money",
   "short": "Rent",
   "help": "Median gross rent (rent plus utilities) from Census ACS, by ZIP; markets show the renter-weighted average of their ZIPs. Census caps ZIP figures at $3,500."
  },
  {
   "key": "rent_hh",
   "label": "Rent per household, annual",
   "format": "money",
   "short": "Rent $/HH",
   "levels": [
    "us",
    "dma",
    "metro",
    "county"
   ],
   "help": "Typical rent x 12 x the share of households renting: average yearly rent spending across all households."
  },
  {
   "key": "vacancy",
   "label": "Rental vacancy rate",
   "format": "pct",
   "short": "Vacancy",
   "help": "Units vacant for rent as a share of all rental units (Census ACS 5-year). Higher vacancy means properties work harder, and spend more, to fill units. Shown, not scored."
  },
  {
   "key": "permits",
   "label": "New apartment units permitted",
   "format": "int",
   "short": "New units",
   "levels": [
    "us",
    "dma",
    "metro",
    "county"
   ],
   "help": "Units in new buildings with 5 or more units, from the Census Building Permits Survey (latest full year, by county). New buildings in lease-up are heavy advertisers. Shown, not scored."
  },
  {
   "key": "permits_1k",
   "label": "New apartment units per 1,000 renter households",
   "format": "dec2",
   "short": "New/1K",
   "levels": [
    "us",
    "dma",
    "metro",
    "county"
   ],
   "help": "Permitted units in new 5+ unit buildings per 1,000 renter households: how much new supply is coming relative to the market. Shown, not scored."
  },
  {
   "key": "rent_chg",
   "label": "Rent change, past year (Zillow)",
   "format": "pct",
   "short": "Rent chg",
   "levels": [
    "metro"
   ],
   "help": "One-year change in the Zillow Observed Rent Index for the metro. Metros only; Zillow doesn't cover every metro. Shown, not scored.",
   "hideWhenUnavailable": true
  },
  {
   "key": "est",
   "label": "Landlords and property managers",
   "format": "int",
   "short": "Landlords",
   "help": "Residential landlords (lessors of residential buildings) and residential property managers, from Census Business Patterns. DMAs, metros and the U.S. use complete county counts; in the ZIP view, Census doesn't publish a ZIP's count when it has fewer than 3 businesses."
  },
  {
   "key": "per10k",
   "label": "Landlords and managers per 10,000 renter households",
   "format": "dec2",
   "short": "Per 10K"
  },
  {
   "key": "growth",
   "label": "One-year growth in landlords and managers",
   "format": "pct",
   "short": "Growth",
   "help": "Change in business count from the prior Business Patterns year. Blank where there were fewer than 3 businesses."
  },
  {
   "key": "under",
   "label": "Underserved",
   "format": "text",
   "short": "Underserved",
   "perSub": true,
   "levels": [
    "dma",
    "metro",
    "county",
    "zip"
   ],
   "help": "Strong renter demand (70th percentile or higher) but few landlords and managers per renter household (30th percentile or lower). Shown, not scored."
  },
  {
   "key": "population",
   "label": "Population",
   "format": "int"
  },
  {
   "key": "households",
   "label": "Households",
   "format": "int"
  },
  {
   "key": "renters",
   "label": "Renter households",
   "format": "int",
   "short": "Renters"
  },
  {
   "key": "renter_share",
   "label": "Share of households renting",
   "format": "pct",
   "short": "Renting"
  },
  {
   "key": "moved_share",
   "label": "Renters who moved in 2020 or later",
   "format": "pct",
   "subs": [
    "all"
   ]
  },
  {
   "key": "apt_share",
   "label": "Renters in buildings with 5+ units",
   "format": "pct",
   "subs": [
    "all",
    "luxury",
    "mid"
   ]
  },
  {
   "key": "rinc100",
   "label": "Renters earning $100K+",
   "format": "int",
   "subs": [
    "luxury"
   ]
  },
  {
   "key": "rinc100_share",
   "label": "Share of renters earning $100K+",
   "format": "pct",
   "subs": [
    "luxury"
   ]
  },
  {
   "key": "r25_44_share",
   "label": "Renter householders 25–44",
   "format": "pct",
   "help": "Share of renter households headed by someone 25 to 44.",
   "subs": [
    "luxury"
   ]
  },
  {
   "key": "rinc_mid",
   "label": "Renters earning $35K–$99K",
   "format": "int",
   "subs": [
    "mid"
   ]
  },
  {
   "key": "rinc_mid_share",
   "label": "Share of renters earning $35K–$99K",
   "format": "pct",
   "subs": [
    "mid"
   ]
  },
  {
   "key": "rinc50_share",
   "label": "Share of renters earning $50K+",
   "format": "pct",
   "subs": [
    "all",
    "mid",
    "senior"
   ]
  },
  {
   "key": "rinc_lt35",
   "label": "Renters earning under $35K",
   "format": "int",
   "subs": [
    "affordable"
   ]
  },
  {
   "key": "rinc_lt35_share",
   "label": "Share of renters earning under $35K",
   "format": "pct",
   "subs": [
    "affordable"
   ]
  },
  {
   "key": "burden_share",
   "label": "Renters paying 30%+ of income in rent",
   "format": "pct",
   "subs": [
    "affordable"
   ]
  },
  {
   "key": "college",
   "label": "College and graduate students",
   "format": "int",
   "subs": [
    "student"
   ]
  },
  {
   "key": "college_share",
   "label": "College students, share of residents",
   "format": "pct",
   "subs": [
    "student"
   ]
  },
  {
   "key": "r_u25",
   "label": "Renter householders under 25",
   "format": "int",
   "subs": [
    "student"
   ]
  },
  {
   "key": "r55p",
   "label": "Renter householders 55+",
   "format": "int",
   "subs": [
    "senior"
   ]
  },
  {
   "key": "r55_share",
   "label": "Share of renters 55+",
   "format": "pct",
   "subs": [
    "senior"
   ]
  },
  {
   "key": "easi_hh",
   "label": "EASI rent spending per household",
   "format": "money",
   "levels": [
    "us",
    "dma",
    "metro"
   ],
   "help": "EASI 2025 estimated yearly rent per household. EASI's figure varies little between markets and doesn't track Census rents closely, so it's shown for reference and only EASI's market totals are scored.",
   "hideWhenUnavailable": true
  }
 ],
 "rankBy": [
  "score",
  "rent_idx",
  "easi_total",
  "density"
 ],
 "defaultRank": "score",
 "components": [
  "demand",
  "category",
  "spend",
  "comp"
 ],
 "detailMeasures": [
  "rent",
  "rent_hh",
  "rent_idx",
  "easi_total",
  "vacancy",
  "permits",
  "permits_1k",
  "rent_chg",
  "density",
  "est",
  "per10k",
  "growth",
  "under",
  "population",
  "households",
  "renters",
  "renter_share",
  "moved_share",
  "apt_share",
  "rinc100",
  "rinc100_share",
  "r25_44_share",
  "rinc_mid",
  "rinc_mid_share",
  "rinc50_share",
  "rinc_lt35",
  "rinc_lt35_share",
  "burden_share",
  "college",
  "college_share",
  "r_u25",
  "r55p",
  "r55_share",
  "easi_hh"
 ],
 "tableColumns": [
  "score",
  "rent_idx",
  "easi_total",
  "rent",
  "vacancy",
  "renters",
  "under"
 ],
 "methodology": [
  {
   "title": "Market Potential Score",
   "body": [
    "Answers one question: where are an apartment advertiser's prospective residents, and which geographies deserve the most ad dollars?",
    "Market Potential Score = 40% Consumer Demand + 25% Category Spending + 15% Spending Power + 20% Competition. Each part is a percentile (0 to 100) against the other markets at the same level: DMAs against DMAs, metros against metros, ZIPs against the other ZIPs in the same market. Affordable housing and Student housing leave out Spending Power, because those renters aren't defined by what they can pay; the remaining parts keep their relative weights.",
    "A score isn't computed when one of its parts has no data, rather than guessing."
   ]
  },
  {
   "title": "Consumer Demand",
   "body": "The size and concentration of each category's likely residents, from the Census American Community Survey. All apartments: renter households, the share of households renting, renters who moved in 2020 or later (turnover means leases to fill) and renters in buildings with 5+ units. Luxury / Class A: renters earning $100K+, renter householders 25–44 and apartment renters. Mid-market / workforce: renters earning $35K–$99K (count and share) and apartment renters. Affordable housing: renters earning under $35K (count and share) and renters paying 30% or more of income in rent. Student housing: college and graduate students (count and share of residents) and renter householders under 25. Active adult / 55+: renter householders 55+ (count and share of renters)."
  },
  {
   "title": "Category Spending",
   "body": [
    "Half the weight goes to EASI 2025 total rent spending (the size of the market in dollars, EASI's per-household figure times this site's household count) and half to Census rent per household (typical rent x 12 x the share of households renting), which measures how much households here spend on rent.",
    "EASI's per-household rent varies little between markets and doesn't track Census rents closely, so EASI's per-household figure is shown for reference and not scored. Typical rents are Census median gross rents (rent plus utilities) by ZIP, from Adtaxi's Deluxe ZIP file; markets use the renter-weighted average of their ZIPs."
   ]
  },
  {
   "title": "Spending Power",
   "body": "Share of renter households in the income range each category serves: $50K+ for All apartments, Mid-market and Active adult, and $100K+ for Luxury. Not used for Affordable housing or Student housing."
  },
  {
   "title": "Competition",
   "body": "Residential landlords (lessors of residential buildings) and residential property managers per 10,000 renter households, reversed: markets with fewer of them score higher. The same competitor count applies to every category, since Census doesn't separate luxury, student or senior properties. Counts are Census County Business Patterns. Not used in ZIP scores, because Census hides ZIP counts under 3 businesses."
  },
  {
   "title": "Leasing pressure",
   "body": "Rental vacancy, new apartment permits and Zillow rent change show where properties are working hardest to fill units: high vacancy, lots of new buildings in lease-up, or softening rents all push apartment ad budgets up. They're shown for every market but not counted in the score. Vacancy is Census ACS 5-year; permits are the Census Building Permits Survey's latest full year, units in new buildings with 5 or more units, by county; rent change is Zillow's Observed Rent Index over the past year, metros only."
  },
  {
   "title": "Underserved",
   "body": "Flags markets with strong renter demand (70th percentile or higher) but few landlords and property managers per renter household (30th percentile or lower). Shown, not counted in the score."
  },
  {
   "title": "Competitor locations",
   "body": "Switch on Show competitor locations to put a circle on each market (or each ZIP in the ZIP view) sized by the number of residential landlords and property managers, from Census Business Patterns. These are counts by area; Census doesn't publish business addresses. In the ZIP view, Census doesn't publish a ZIP's count when it has fewer than 3 businesses, so those ZIPs show no circle."
  },
  {
   "title": "Measures shown for each category",
   "body": "Rank and map by offers four choices, each answering a different question: the Market Potential Score (where to put the money overall), the rent spending index vs. U.S. (how much households here spend on rent), total rent spending (how big the market is in dollars) and households per square mile (how many prospects a service area can reach). Market details add the parts of the score, leasing pressure, and the renter measures that relate to the selected category."
  },
  {
   "title": "Households per square mile",
   "body": "Households divided by land area from the Census Gazetteer, for each ZIP, metro and DMA. It isn't part of the score; use it to compare how many prospects a service area or radius can reach."
  },
  {
   "title": "ZIPs in a market",
   "body": "Pick a DMA or metro, then choose ZIPs in market. ZIP scores use Consumer Demand and Spending Power, reweighted to 73% and 27% (Consumer Demand only for Affordable and Student housing). ZIPs with fewer than 500 residents are shown but not ranked."
  }
 ],
 "sources": [
  {
   "label": "Census American Community Survey 5-year"
  },
  {
   "label": "Census ZIP and County Business Patterns",
   "url": "https://www.census.gov/programs-surveys/cbp.html"
  },
  {
   "label": "Census Building Permits Survey",
   "url": "https://www.census.gov/construction/bps/"
  },
  {
   "label": "Zillow Observed Rent Index",
   "url": "https://www.zillow.com/research/data/"
  },
  {
   "label": "EASI Demographics 2025 (household rent spending)"
  },
  {
   "label": "Deluxe ZIP file (Q4 2025)"
  },
  {
   "label": "ZIP-level DMA list",
   "url": "https://github.com/BritCrit/dma_county_zip"
  }
 ],
 "sourcesNote": "Rent spending totals are EASI; rents, renter counts and renter traits are Census ACS (rents via the Deluxe ZIP file); landlord counts are Census Business Patterns; permits are the Census Building Permits Survey; rent change is Zillow; population and households are from the Deluxe ZIP file.",
 "pointLayer": {
  "key": "est",
  "label": "Show competitor locations",
  "unit": "landlords and property managers",
  "legend": "Circle size = landlords and property managers in the area",
  "zipNote": "Census doesn't publish ZIPs with fewer than 3."
 }
});
</script>
</body>
</html>
